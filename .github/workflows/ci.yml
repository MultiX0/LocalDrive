name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# this workflow moved to the repository root, where GitHub will actually run
# it. everything in it is still about the Go server, so the working directory
# is set once here rather than on each step.
defaults:
  run:
    working-directory: server

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: server/go.sum

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l . | grep -v '^vendor/' || true)"
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: go build ./cmd/localdrive

  client:
    name: Client analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: localdrive
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      # the generated sources are gitignored, so a clean checkout does not
      # analyse until they exist. this is not an optional convenience step.
      - name: Generate
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  docs:
    name: Documentation and site build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Dependencies
        run: npm ci

      # this build parses every file in docs/ and fails on an internal link
      # that does not resolve. it is the only link checker the project has, so
      # it runs on every change and not only on ones that touch the site.
      - name: Build
        run: npm run build

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          # the module lives in server/, not at the root. Without this the
          # cache lookup goes looking for a go.mod beside the workflow, misses,
          # and every run downloads the module set again.
          cache-dependency-path: server/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  image:
    name: Image build and scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t localdrive/server:ci -f Dockerfile .

      - name: Scan the image
        # pinned to a release rather than a branch: an action referenced by a
        # moving ref runs whatever that branch holds at the moment CI runs,
        # which is somebody else's code with this workflow's permissions
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: localdrive/server:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  cross-compile:
    name: The binary, for every target someone might run it on
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: server/go.sum
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o /tmp/localdrive ./cmd/localdrive
