name: localdrive
description: "Local Drive: your own file server, on your own hardware."
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # state and navigation
  flutter_riverpod: ^2.6.1
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.21.2
  go_router: ^14.6.2

  # networking and transport
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  connectivity_plus: ^6.1.0

  # local persistence: the durable transfer queue and the metadata cache
  drift: ^2.22.1
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0

  # security
  flutter_secure_storage: ^9.2.2

  # platform integration
  file_picker: ^8.1.6
  desktop_drop: ^0.5.0
  receive_sharing_intent: ^1.8.1
  multicast_dns: ^0.3.2+7
  device_info_plus: ^11.2.0
  package_info_plus: ^8.1.2
  url_launcher: ^6.3.1
  open_filex: ^4.6.0
  flutter_local_notifications: ^18.0.1

  # desktop chrome: a borderless window with the app's own title bar, and a
  # tray icon so closing the window does not mean losing a running transfer
  bitsdojo_window: ^0.1.6
  tray_manager: ^0.3.2
  launch_at_startup: ^0.5.1

  # media and preview. Audio and video both run on media_kit, so there is one
  # player to reason about rather than a separate one per format.
  pdfrx: ^1.0.94
  photo_view: ^0.15.0

  # every remote image goes through this, so a thumbnail is fetched once and
  # then read from disk rather than re-downloaded on every scroll
  cached_network_image: ^3.4.1

  # the gallery's masonry layout. Layout only: nothing here is visible, the
  # tiles are the app's own
  flutter_staggered_grid_view: ^0.7.0

  # office and text formats, all parsed in Dart so a preview needs nothing
  # installed on the server. xlsx, docx, ods and odt are all a zip of xml, so
  # these two cover every one of them and the reading is ours to shape
  archive: ^4.0.9
  xml: ^7.0.1
  markdown: ^7.3.0

  # presentation
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  intl: ^0.20.2
  shared_preferences: ^2.5.5

  # browser interop, for the one place a download has no filesystem to land on
  web: ^1.1.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  riverpod_lint: ^2.6.3
  custom_lint: ^0.7.0
  drift_dev: ^2.22.1
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.3
  image: ^4.9.1

flutter:
  uses-material-design: true
  generate: true

  # the icon set and the empty-state illustrations are drawn in code, so the
  # only bundled asset is the logo the platform toolchains need a raster of
  assets:
    - assets/logo/

# the app icon and the splash both come from the same master mark, so they can
# never drift apart
flutter_launcher_icons:
  image_path: "assets/logo/mark_1024.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 23
  adaptive_icon_background: "#141414"
  adaptive_icon_foreground: "assets/logo/mark_foreground_1024.png"
  web:
    generate: true
    background_color: "#141414"
    theme_color: "#141414"
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true

flutter_native_splash:
  color: "#141414"
  image: assets/logo/mark_splash.png
  android_12:
    color: "#141414"
    image: assets/logo/mark_splash.png
  web: false
